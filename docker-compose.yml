services:
  # =============================================================================
  # BACKEND SERVICE (FastAPI + XGBoost + ONNX + SQLite)
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cropfit-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/cropfit.db
      - MODELS_DIR=/app/ml_experiments/models
    volumes:
      # Persistent named volume for SQLite database storage across restarts
      - cropfit_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - cropfit-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # FRONTEND SERVICE (React + TypeScript + Vite + Nginx Reverse Proxy)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cropfit-frontend
    restart: unless-stopped
    ports:
      # Access web app at http://localhost:3000 (or change to "80:80" for standard HTTP)
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cropfit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================
volumes:
  cropfit_data:
    driver: local

networks:
  cropfit-network:
    driver: bridge
